name: Build Dune IMAX Android APK
on:
  push:
    branches: [ dune-ticket-alarm-build-2026 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK with preinstalled Android SDK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify no notification-listener access is requested
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest_dump.txt
          if grep -E 'BIND_NOTIFICATION_LISTENER_SERVICE|NotificationListenerService' manifest_dump.txt; then
            echo "Forbidden notification-listener service found" >&2
            exit 1
          fi
          echo "Verified: no notification listener in manifest"
      - uses: actions/upload-artifact@v4
        with:
          name: dune-15-minute-alarm-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
